services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_DEFAULT_PIPELINE: hybrid
      BACKEND_ALLOWED_INPUT_ROOT: /workspace
      BACKEND_OUTPUT_DIR: /workspace/backend/runtime
      MODEL_PROVIDER: ${MODEL_PROVIDER:-lanxin}
      LANXIN_API_KEY: ${LANXIN_API_KEY:-}
      LANXIN_BASE_URL: ${LANXIN_BASE_URL:-https://api-ai.vivo.com.cn/v1}
      LANXIN_MODEL: ${LANXIN_MODEL:-Doubao-Seed-2.0-mini}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-90}
      LANXIN_RETRIES: ${LANXIN_RETRIES:-1}
    volumes:
      - ./runtime:/workspace/backend/runtime
